name: secret-scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Block any push that leaks secrets. Uses gitleaks (free, OSS, ~50MB).
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs full history

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only needed for the Pro version; community
          # edition (this one) is free and fully functional.
          GITLEAKS_CONFIG: .gitleaks.toml
        # Default: fail the workflow on any detected secret.
